name: 自动转换音频文件为 MP3

on:
  push:
    paths:
      - '**.m4s'
      - '**.M4S'
      - '**.m4a'
      - '**.M4A'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      # 升级到 v5 以避免 Node.js 版本警告
      - uses: actions/checkout@v5

      - name: 安装 ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: 列出所有待转换的文件
        run: |
          echo "=== M4S 文件 ==="
          find . -type f \( -iname "*.m4s" \) -not -path "./.git/*" -exec echo "  {}" \;
          echo "=== M4A 文件 ==="
          find . -type f \( -iname "*.m4a" \) -not -path "./.git/*" -exec echo "  {}" \;

      - name: 转换 M4S/M4A 为 MP3（含删除原始文件）
        run: |
          # 处理 M4S（碎片化 MP4，ffmpeg 可直接读取）
          find . -type f \( -iname "*.m4s" \) -not -path "./.git/*" -print0 | while IFS= read -r -d '' f; do
            echo "--- 开始处理 M4S: $f ---"
            if ffmpeg -i "$f" -vn -c:a libmp3lame -b:a 192k "${f%.*}.mp3" 2>&1; then
              echo "转换成功，删除原始文件: $f"
              rm -f "$f"
            else
              echo "转换失败，保留原始文件: $f"
            fi
            echo "--- 完成处理 M4S: $f ---"
          done

          # 处理 M4A（普通 AAC 容器）
          find . -type f \( -iname "*.m4a" \) -not -path "./.git/*" -print0 | while IFS= read -r -d '' f; do
            echo "--- 开始处理 M4A: $f ---"
            if ffmpeg -i "$f" -vn -c:a libmp3lame -b:a 192k "${f%.*}.mp3" 2>&1; then
              echo "转换成功，删除原始文件: $f"
              rm -f "$f"
            else
              echo "转换失败，保留原始文件: $f"
            fi
            echo "--- 完成处理 M4A: $f ---"
          done

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          if git diff --quiet && git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动转换 M4S/M4A 为 MP3，并删除原始文件"
            git push
          fi