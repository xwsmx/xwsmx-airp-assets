name: 自动把 m4a 转成 mp3

on:
  # 方式一：当你推送了 .m4a 文件时自动触发
  push:
    paths:
      - '**.m4a'
  # 方式二：允许你手动在 Actions 页面点按钮触发
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      # 1. 把仓库代码下载到虚拟机
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 ffmpeg（音频转换工具）
      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # 3. 找到所有 .m4a 文件，每个都转成 .mp3
      - name: 转换 m4a 为 mp3
        run: |
          find . -type f -name "*.m4a" | while read f; do
            echo "正在转换：$f"
            ffmpeg -i "$f" -codec:a libmp3lame -b:a 192k "${f%.m4a}.mp3"
          done

      # 4. 把新生成的 .mp3 文件提交并推送回仓库
      - name: 提交 mp3 文件
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "自动转换 m4a 为 mp3"
          git push
